<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur IR Maroc — Calculez votre salaire net</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            morocco: {
              red: '#c1272d',
              green: '#006233',
              dark: '#032313',
              gold: '#d4af37',
              emerald: '#059669',
            },

              900: '#0f172a',
              950: '#070b14',
            }
          },
          boxShadow: {

            'glow-blue': '0 0 35px -5px rgba(59, 130, 246, 0.3)',
            'glow-purple': '0 0 35px -5px rgba(168, 85, 247, 0.3)',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Babel Standalone for in-browser JSX transpilation -->

<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-200 min-h-screen custom-gradient-bg noise-overlay">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center space-y-4">
        <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-slate-400 font-medium">Chargement du simulateur d'IR Maroc...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { motion } = window.Motion;

    // --- FORMULAS & CALCULATION ENGINE ---
    // All numbers match the Moroccan CGI (Code Général des Impôts - LF 2025 art. 73 & 74) & Reform Proposal
    function calculateIRSimulation(brutMensuel, dependents = 0) {
      const brut = Math.max(0, Number(brutMensuel) || 0);
      const dep = Math.min(6, Math.max(0, Number(dependents) || 0));
      
      const brutAnnuel = brut * 12;
      
      // Cotisations Sociales
      // CNSS : 4.48% plafonné à 6000 DH/mois
      const cnssMois = Math.min(brut, 6000) * 0.0448;
      // AMO : 2.26% sans plafond
      const amoMois = brut * 0.0226;
      const totalCotisationsMois = cnssMois + amoMois;
      const totalCotisationsAn = totalCotisationsMois * 12;

      // Frais Professionnels (Déduction forfaitaire)
      // Seuil brut annuel = 78 000 DH. Taux 35% si <= 78000, 25% si > 78000. Plafond = 35 000 DH/an
      const tauxFraisPro = brutAnnuel <= 78000 ? 0.35 : 0.25;
      const fraisProMois = Math.min(brut * tauxFraisPro, 35000 / 12);
      const fraisProAn = fraisProMois * 12;

      // Revenu Net Imposable (RNI)
      const rniMois = Math.max(0, brut - totalCotisationsMois - fraisProMois);
      const rniAnnuel = rniMois * 12;

      // Déduction charges de famille : 500 DH/an par personne (max 6)
      const deductionFamilleAn = dep * 500;
      const deductionFamilleMois = deductionFamilleAn / 12;

      // --- BARÈME ACTUEL (LF 2025, applicable 2026) ---
      // 0 - 40 000 : 0% (0)
      // 40 000 - 60 000 : 10% (4 000)
      // 60 000 - 80 000 : 20% (10 000)
      // 80 000 - 100 000 : 30% (18 000)
      // 100 000 - 180 000 : 34% (22 000)
      // > 180 000 : 37% (27 400)
      let tauxMarginalActuel = 0;
      let sommeADeduireActuel = 0;
      if (rniAnnuel <= 40000) { tauxMarginalActuel = 0; sommeADeduireActuel = 0; }
      else if (rniAnnuel <= 60000) { tauxMarginalActuel = 0.10; sommeADeduireActuel = 4000; }
      else if (rniAnnuel <= 80000) { tauxMarginalActuel = 0.20; sommeADeduireActuel = 10000; }
      else if (rniAnnuel <= 100000) { tauxMarginalActuel = 0.30; sommeADeduireActuel = 18000; }
      else if (rniAnnuel <= 180000) { tauxMarginalActuel = 0.34; sommeADeduireActuel = 22000; }
      else { tauxMarginalActuel = 0.37; sommeADeduireActuel = 27400; }

      const irBrutActuelAn = Math.max(0, rniAnnuel * tauxMarginalActuel - sommeADeduireActuel);
      const irNetActuelAn = Math.max(0, irBrutActuelAn - deductionFamilleAn);
      const irActuelMois = irNetActuelAn / 12;
      const netActuelMois = brut - totalCotisationsMois - irActuelMois;
      const tauxReelActuel = brut > 0 ? (irActuelMois / brut) : 0;

      // Tranche par tranche Actuel
      const tranchesActuelDef = [
        { name: "Tranche 1", min: 0, max: 40000, rate: 0.00, label: "0 à 40 000 DH" },
        { name: "Tranche 2", min: 40000, max: 60000, rate: 0.10, label: "40 001 à 60 000 DH" },
        { name: "Tranche 3", min: 60000, max: 80000, rate: 0.20, label: "60 001 à 80 000 DH" },
        { name: "Tranche 4", min: 80000, max: 100000, rate: 0.30, label: "80 001 à 100 000 DH" },
        { name: "Tranche 5", min: 100000, max: 180000, rate: 0.34, label: "100 001 à 180 000 DH" },
        { name: "Tranche 6", min: 180000, max: Infinity, rate: 0.37, label: "> 180 000 DH" }
      ];

      const tranchesActuelDetails = tranchesActuelDef.map(t => {
        let taxable = 0;
        if (rniAnnuel > t.min) {
          taxable = Math.min(rniAnnuel, t.max) - t.min;
        }
        return {
          ...t,
          taxable,
          ir: taxable * t.rate
        };
      });

      // --- BARÈME RÉFORME (Hypothèse annoncée 2027-2031) ---
      // 0 - 60 000 : 0% (0)
      // 60 000 - 180 000 : 10% (6 000)
      // 180 000 - 480 000 : 20% (24 000)
      // > 480 000 : 30% (72 000)
      let tauxMarginalReforme = 0;
      let sommeADeduireReforme = 0;
      if (rniAnnuel <= 60000) { tauxMarginalReforme = 0; sommeADeduireReforme = 0; }
      else if (rniAnnuel <= 180000) { tauxMarginalReforme = 0.10; sommeADeduireReforme = 6000; }
      else if (rniAnnuel <= 480000) { tauxMarginalReforme = 0.20; sommeADeduireReforme = 24000; }
      else { tauxMarginalReforme = 0.30; sommeADeduireReforme = 72000; }

      const irBrutReformeAn = Math.max(0, rniAnnuel * tauxMarginalReforme - sommeADeduireReforme);
      const irNetReformeAn = Math.max(0, irBrutReformeAn - deductionFamilleAn);
      const irReformeMois = irNetReformeAn / 12;
      const netReformeMois = brut - totalCotisationsMois - irReformeMois;
      const tauxReelReforme = brut > 0 ? (irReformeMois / brut) : 0;

      // Tranche par tranche Réforme
      const tranchesReformeDef = [
        { name: "Tranche 1", min: 0, max: 60000, rate: 0.00, label: "0 à 60 000 DH" },
        { name: "Tranche 2", min: 60000, max: 180000, rate: 0.10, label: "60 001 à 180 000 DH" },
        { name: "Tranche 3", min: 180000, max: 480000, rate: 0.20, label: "180 001 à 480 000 DH" },
        { name: "Tranche 4", min: 480000, max: Infinity, rate: 0.30, label: "> 480 000 DH" }
      ];

      const tranchesReformeDetails = tranchesReformeDef.map(t => {
        let taxable = 0;
        if (rniAnnuel > t.min) {
          taxable = Math.min(rniAnnuel, t.max) - t.min;
        }
        return {
          ...t,
          taxable,
          ir: taxable * t.rate
        };
      });

      // Impact & Différences
      const gainMois = irActuelMois - irReformeMois;
      const gainAn = gainMois * 12;
      const hausseNetPct = netActuelMois > 0 ? (gainMois / netActuelMois) : 0;
      const baisseTauxPoints = (tauxReelActuel - tauxReelReforme) * 100;

      return {
        brut,
        brutAnnuel,
        dependents: dep,
        deductionFamilleAn,
        deductionFamilleMois,
        cotisations: {
          cnssMois,
          amoMois,
          totalMois: totalCotisationsMois,
          totalAn: totalCotisationsAn
        },
        fraisPro: {
          taux: tauxFraisPro,
          mois: fraisProMois,
          an: fraisProAn
        },
        rni: {
          mois: rniMois,
          an: rniAnnuel
        },
        actuel: {
          tauxMarginal: tauxMarginalActuel,
          sommeADeduire: sommeADeduireActuel,
          irBrutAn: irBrutActuelAn,
          irNetAn: irNetActuelAn,
          irMois: irActuelMois,
          netMois: netActuelMois,
          tauxReel: tauxReelActuel,
          tranches: tranchesActuelDetails
        },
        reforme: {
          tauxMarginal: tauxMarginalReforme,
          sommeADeduire: sommeADeduireReforme,
          irBrutAn: irBrutReformeAn,
          irNetAn: irNetReformeAn,
          irMois: irReformeMois,
          netMois: netReformeMois,
          tauxReel: tauxReelReforme,
          tranches: tranchesReformeDetails
        },
        gainMois,
        gainAn,
        hausseNetPct,
        baisseTauxPoints
      };
    }

    // Reference profiles from the original dataset
    const PRESET_PROFILES = [
      { brut: 3500, label: "3 500 DH", role: "SMIG / Ouvrier", tag: "Exonéré" },
      { brut: 6000, label: "6 000 DH", role: "Technicien", tag: "+16 DH" },
      { brut: 10000, label: "10 000 DH", role: "Cadre Junior", tag: "+401 DH" },
      { brut: 15000, label: "15 000 DH", role: "Cadre Confirmé", tag: "+1 421 DH", popular: true },
      { brut: 20000, label: "20 000 DH", role: "Ingénieur Senior", tag: "+2 498 DH" },
      { brut: 40000, label: "40 000 DH", role: "Directeur / Manager", tag: "+5 821 DH" },
      { brut: 100000, label: "100 000 DH", role: "Top Management", tag: "+10 335 DH" },
    ];

    // Formatters
    const fmtDH = (val, decimals = 2) => {
      if (val === undefined || val === null || isNaN(val)) return "0.00 DH";
      return new Intl.NumberFormat('fr-MA', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }).format(val) + " DH";
    };

    const fmtNum = (val, decimals = 2) => {
      if (val === undefined || val === null || isNaN(val)) return "0";
      return new Intl.NumberFormat('fr-MA', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }).format(val);
    };

    const fmtPct = (val, decimals = 2) => {
      if (val === undefined || val === null || isNaN(val)) return "0.00%";
      return (val * 100).toFixed(decimals) + "%";
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [brutInput, setBrutInput] = useState(15000);
      const [dependents, setDependents] = useState(0);
      const [trancheTab, setTrancheTab] = useState("both"); // 'both', 'actuel', 'reforme'

      // Calculation Result
      const sim = useMemo(() => {
        return calculateIRSimulation(brutInput, dependents);
      }, [brutInput, dependents]);

      // Confetti trigger for high gain or preset selection
      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.7 },
            colors: ['#10b981', '#059669', '#34d399', '#3b82f6', '#f59e0b']
          });
        }
      };

      const handlePresetClick = (brut) => {
        setBrutInput(brut);
        triggerConfetti();
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Banner / Morocco Seal */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur-xl sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                <div className="flex items-center space-x-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-500 via-emerald-600 to-teal-800 p-0.5 shadow-lg shadow-emerald-500/20 flex items-center justify-center">
                    <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                      <svg className="w-6 h-6 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                      </svg>
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="text-xs font-semibold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20">
                        Royaume du Maroc • CGI LF 2025
                      </span>
                      <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-amber-500/10 text-amber-300 border border-amber-500/20">
                        Horizon 2027–2031
                      </span>
                    </div>
                    <h1 className="text-lg sm:text-xl font-bold text-white tracking-tight flex items-center gap-2">
                      Simulateur IR — votre salaire
                    </h1>
                  </div>
                </div>

                <div className="hidden md:flex items-center space-x-3">
                  <a 
                    href="#calculator-section" 
                    className="inline-flex items-center space-x-2 px-4 py-2 text-sm font-semibold rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-md shadow-emerald-500/25 transition-all transform hover:-translate-y-0.5"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Simuler mon salaire</span>
                  </a>
                  <a
                    href="https://forkanimahdi.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="inline-flex items-center space-x-2 px-3.5 py-2 text-xs font-medium rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
                  >
                    <span>@forkanimahdi</span>
                    <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </header>

          {/* Hero Highlight Stats Cards */}
          <section className="relative overflow-hidden pt-8 pb-6 border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-8">
                <motion.div 
                  initial={{ opacity: 0, y: -10 }} 
                  animate={{ opacity: 1, y: 0 }}
                  className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300 text-xs font-medium mb-3"
                >
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  Votre simulation personnelle en temps réel
                </motion.div>
                <motion.h2 
                  initial={{ opacity: 0, y: 10 }}
                  animate={{ opacity: 1, y: 0 }}
                  transition={{ delay: 0.1 }}
                  className="text-2xl sm:text-4xl font-extrabold text-white tracking-tight"
                >
                  Simulez l'impact sur <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">votre salaire net</span>
                </motion.h2>
                <motion.p 
                  initial={{ opacity: 0, y: 10 }}
                  animate={{ opacity: 1, y: 0 }}
                  transition={{ delay: 0.2 }}
                  className="mt-3 text-sm sm:text-base text-slate-400"
                >
                  Mesurez avec précision l'effet de l'abaissement des taux, de l'exonération élargie à 60 000 DH et du nouveau barème fiscal à 4 tranches.
                </motion.p>
              </div>

              {/* 4 Key Pillar Stats */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <motion.div 
                  initial={{ opacity: 0, scale: 0.95 }}
                  animate={{ opacity: 1, scale: 1 }}
                  transition={{ delay: 0.1 }}
                  className="bg-slate-900/60 backdrop-blur border border-slate-800 p-4 rounded-2xl relative overflow-hidden group hover:border-emerald-500/40 transition"
                >
                  <div className="text-xs font-medium text-slate-400">Seuil d'Exonération Total</div>
                  <div className="flex items-baseline gap-2 mt-2">
                    <span className="text-2xl font-black text-emerald-400">60 000</span>
                    <span className="text-xs text-slate-400">DH/an</span>
                  </div>
                  <div className="mt-1 flex items-center text-xs text-emerald-400/90 gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
                    <span>+50% vs actuel (40k DH)</span>
                  </div>
                  <div className="text-[11px] text-slate-500 mt-1">Jusqu'à ~6 000 DH brut/mois à 0% IR</div>
                </motion.div>

                <motion.div 
                  initial={{ opacity: 0, scale: 0.95 }}
                  animate={{ opacity: 1, scale: 1 }}
                  transition={{ delay: 0.2 }}
                  className="bg-slate-900/60 backdrop-blur border border-slate-800 p-4 rounded-2xl relative overflow-hidden group hover:border-blue-500/40 transition"
                >
                  <div className="text-xs font-medium text-slate-400">Taux Marginal Maximal</div>
                  <div className="flex items-baseline gap-2 mt-2">
                    <span className="text-2xl font-black text-blue-400">30%</span>
                    <span className="text-xs text-slate-400">max</span>
                  </div>
                  <div className="mt-1 flex items-center text-xs text-blue-400/90 gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
                    <span>Baisse de 7 points (vs 37%)</span>
                  </div>
                  <div className="text-[11px] text-slate-500 mt-1">Au-delà de 480 000 DH/an</div>
                </motion.div>

                <motion.div 
                  initial={{ opacity: 0, scale: 0.95 }}
                  animate={{ opacity: 1, scale: 1 }}
                  transition={{ delay: 0.3 }}
                  className="bg-slate-900/60 backdrop-blur border border-slate-800 p-4 rounded-2xl relative overflow-hidden group hover:border-purple-500/40 transition"
                >
                  <div className="text-xs font-medium text-slate-400">Simplification du Barème</div>
                  <div className="flex items-baseline gap-2 mt-2">
                    <span className="text-2xl font-black text-purple-400">4 Tranches</span>
                  </div>
                  <div className="mt-1 flex items-center text-xs text-purple-400/90 gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    <span>Au lieu de 6 tranches</span>
                  </div>
                  <div className="text-[11px] text-slate-500 mt-1">0%, 10%, 20% et 30%</div>
                </motion.div>

                <motion.div 
                  initial={{ opacity: 0, scale: 0.95 }}
                  animate={{ opacity: 1, scale: 1 }}
                  transition={{ delay: 0.4 }}
                  className="bg-slate-900/60 backdrop-blur border border-slate-800 p-4 rounded-2xl relative overflow-hidden group hover:border-amber-500/40 transition"
                >
                  <div className="text-xs font-medium text-slate-400">Gain Annuel Maximal Observé</div>
                  <div className="flex items-baseline gap-2 mt-2">
                    <span className="text-2xl font-black text-amber-400">+124 026</span>
                    <span className="text-xs text-slate-400">DH/an</span>
                  </div>
                  <div className="mt-1 flex items-center text-xs text-amber-400/90 gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>+10 335 DH / mois</span>
                  </div>
                  <div className="text-[11px] text-slate-500 mt-1">Pour les profils de 100k DH</div>
                </motion.div>
              </div>
            </div>
          </section>

          {/* MAIN CONTENT — simulateur personnel */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8" id="calculator-section">
              <motion.div
                  initial={{ opacity: 0, y: 15 }}
                  animate={{ opacity: 1, y: 0 }}
                  transition={{ duration: 0.25 }}

                          onClick={() => setTrancheTab("both")}
                          className={`px-3 py-1.5 rounded-lg transition ${trancheTab === "both" ? "bg-slate-800 text-white" : "text-slate-400 hover:text-white"}`}
                        >
                          Vue Côte à Côte
                        </button>
                        <button
                          onClick={() => setTrancheTab("actuel")}
                          className={`px-3 py-1.5 rounded-lg transition ${trancheTab === "actuel" ? "bg-blue-600 text-white" : "text-slate-400 hover:text-white"}`}
                        >
                          Actuel (6 tranches)
                        </button>
                        <button
                          onClick={() => setTrancheTab("reforme")}
                          className={`px-3 py-1.5 rounded-lg transition ${trancheTab === "reforme" ? "bg-emerald-600 text-white" : "text-slate-400 hover:text-white"}`}
                        >
                          Réforme (4 tranches)
                        </button>
                      </div>
                    </div>

                    {/* Tranche Tables */}
                    <div className={`grid gap-6 ${trancheTab === "both" ? "grid-cols-1 lg:grid-cols-2" : "grid-cols-1"}`}>
                      
                      {/* Barème Actuel Table */}
                      {(trancheTab === "both" || trancheTab === "actuel") && (
                        <div className="border border-slate-800 rounded-2xl overflow-hidden bg-slate-950/60">
                          <div className="bg-slate-900/90 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                            <span className="text-xs font-bold text-blue-400 uppercase tracking-wider flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-blue-400"></span>
                              Barème ACTUEL (LF 2025)
                            </span>
                            <span className="text-xs font-mono text-slate-400">
                              IR Total: <strong className="text-white">{fmtDH(sim.actuel.irBrutAn)}</strong>
                            </span>
                          </div>

                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-900/50 text-slate-400 border-b border-slate-800">
                                <tr>
                                  <th className="py-2.5 px-3 font-semibold">Tranche</th>
                                  <th className="py-2.5 px-3 font-semibold">Fourchette (DH)</th>
                                  <th className="py-2.5 px-3 font-semibold text-center">Taux</th>
                                  <th className="py-2.5 px-3 font-semibold text-right">Montant Imposé</th>
                                  <th className="py-2.5 px-3 font-semibold text-right">IR Généré</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800/60 font-mono">
                                {sim.actuel.tranches.map((t, idx) => {
                                  const isActive = t.taxable > 0;
                                  return (
                                    <tr key={idx} className={isActive ? "bg-blue-500/5 hover:bg-blue-500/10 transition" : "text-slate-600"}>
                                      <td className="py-2.5 px-3 font-sans font-medium text-slate-300">{t.name}</td>
                                      <td className="py-2.5 px-3 text-slate-400">{t.label}</td>
                                      <td className="py-2.5 px-3 text-center font-bold text-blue-400">{fmtPct(t.rate, 0)}</td>
                                      <td className="py-2.5 px-3 text-right text-slate-200">{fmtNum(t.taxable, 2)}</td>
                                      <td className="py-2.5 px-3 text-right font-bold text-white">{fmtNum(t.ir, 2)}</td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                              <tfoot className="bg-slate-900/80 font-mono text-xs border-t border-slate-800 font-semibold">
                                <tr>
                                  <td colSpan="4" className="py-2.5 px-3 text-right text-slate-400 font-sans">Total IR Brut Annuel :</td>
                                  <td className="py-2.5 px-3 text-right text-blue-400 font-bold">{fmtDH(sim.actuel.irBrutAn)}</td>
                                </tr>
                                <tr>
                                  <td colSpan="4" className="py-2 px-3 text-right text-slate-400 font-sans">Déduction Charges Famille ({sim.dependents} pers) :</td>
                                  <td className="py-2 px-3 text-right text-emerald-400">-{fmtDH(sim.deductionFamilleAn, 0)}</td>
                                </tr>
                                <tr className="bg-slate-900 text-sm">
                                  <td colSpan="4" className="py-2.5 px-3 text-right text-white font-sans font-bold">IR Net Mensuel à Payer :</td>
                                  <td className="py-2.5 px-3 text-right text-rose-400 font-black">{fmtDH(sim.actuel.irMois)}</td>
                                </tr>
                              </tfoot>
                            </table>
                          </div>
                        </div>
                      )}

                      {/* Barème Réforme Table */}
                      {(trancheTab === "both" || trancheTab === "reforme") && (
                        <div className="border border-emerald-500/30 rounded-2xl overflow-hidden bg-slate-950/60 shadow-lg shadow-emerald-500/5">
                          <div className="bg-emerald-950/40 px-4 py-3 border-b border-emerald-500/20 flex justify-between items-center">
                            <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                              Barème RÉFORME (Hypothèse)
                            </span>
                            <span className="text-xs font-mono text-emerald-300">
                              IR Total: <strong className="text-white">{fmtDH(sim.reforme.irBrutAn)}</strong>
                            </span>
                          </div>

                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-900/50 text-slate-400 border-b border-slate-800">
                                <tr>
                                  <th className="py-2.5 px-3 font-semibold">Tranche</th>
                                  <th className="py-2.5 px-3 font-semibold">Fourchette (DH)</th>
                                  <th className="py-2.5 px-3 font-semibold text-center">Taux</th>
                                  <th className="py-2.5 px-3 font-semibold text-right">Montant Imposé</th>
                                  <th className="py-2.5 px-3 font-semibold text-right">IR Généré</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800/60 font-mono">
                                {sim.reforme.tranches.map((t, idx) => {
                                  const isActive = t.taxable > 0;
                                  return (
                                    <tr key={idx} className={isActive ? "bg-emerald-500/5 hover:bg-emerald-500/10 transition" : "text-slate-600"}>
                                      <td className="py-2.5 px-3 font-sans font-medium text-slate-300">{t.name}</td>
                                      <td className="py-2.5 px-3 text-slate-400">{t.label}</td>
                                      <td className="py-2.5 px-3 text-center font-bold text-emerald-400">{fmtPct(t.rate, 0)}</td>
                                      <td className="py-2.5 px-3 text-right text-slate-200">{fmtNum(t.taxable, 2)}</td>
                                      <td className="py-2.5 px-3 text-right font-bold text-emerald-300">{fmtNum(t.ir, 2)}</td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                              <tfoot className="bg-slate-900/80 font-mono text-xs border-t border-slate-800 font-semibold">
                                <tr>
                                  <td colSpan="4" className="py-2.5 px-3 text-right text-slate-400 font-sans">Total IR Brut Annuel :</td>
                                  <td className="py-2.5 px-3 text-right text-emerald-400 font-bold">{fmtDH(sim.reforme.irBrutAn)}</td>
                                </tr>
                                <tr>
                                  <td colSpan="4" className="py-2 px-3 text-right text-slate-400 font-sans">Déduction Charges Famille ({sim.dependents} pers) :</td>
                                  <td className="py-2 px-3 text-right text-emerald-400">-{fmtDH(sim.deductionFamilleAn, 0)}</td>
                                </tr>
                                <tr className="bg-emerald-950/50 text-sm">
                                  <td colSpan="4" className="py-2.5 px-3 text-right text-emerald-200 font-sans font-bold">Nouveau IR Net Mensuel :</td>
                                  <td className="py-2.5 px-3 text-right text-emerald-300 font-black">{fmtDH(sim.reforme.irMois)}</td>
                                </tr>
                              </tfoot>
                            </table>
                          </div>
                        </div>
                      )}

                    </div>
                  </div>
                </motion.div>
          </main>

          {/* FOOTER */}
          <footer className="mt-auto border-t border-slate-800 bg-slate-950/95 backdrop-blur py-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                
                <div className="flex items-center space-x-3">
                  <div className="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold">
                    MA
                  </div>
                  <div className="text-xs text-slate-400">
                    <span className="font-semibold text-slate-300 block">Simulateur Fiscal IR Maroc 2026</span>
                    Conforme aux règles de liquidation du CGI marocain.
                  </div>
                </div>

                {/* EXACT USER MANDATED FOOTER LINK */}
                <div className="flex items-center space-x-2 text-sm text-slate-300">
                  <span>build with</span>
                  <a
                    href="https://forkanimahdi.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-slate-900 hover:bg-slate-800 text-emerald-400 hover:text-emerald-300 border border-slate-800 hover:border-emerald-500/40 font-mono font-medium transition group"
                  >
                    <span>@forkanimahdi</span>
                    <svg className="w-3.5 h-3.5 text-slate-500 group-hover:text-emerald-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                  </a>
                </div>

              </div>

              <div className="mt-4 pt-4 border-t border-slate-900 text-center text-slate-600 text-[11px]">
                Simulateur personnel indicatif : chacun peut saisir son salaire brut et estimer l'impact de la réforme IR.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Mount React App — surface errors instead of leaving the loading spinner forever
    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } catch (err) {
      console.error(err);
      document.getElementById('root').innerHTML =
        '<div style="padding:2rem;color:#f87171;font-family:sans-serif;max-width:40rem;margin:4rem auto">' +
        '<h2 style="color:#fff;margin-bottom:0.5rem">Erreur de chargement du simulateur</h2>' +
        '<pre style="white-space:pre-wrap;background:#1e293b;padding:1rem;border-radius:0.75rem">' +
        String(err && err.message ? err.message : err) +
        '</pre></div>';
    }
  </script>
</body>
</html>
